// ---------- localStorage-backed polyfill for Claude's window.storage API ----------
window.storage = {
  async get(key) {
    const value = localStorage.getItem(key);
    if (value === null) throw new Error('Key not found: ' + key);
    return { key, value, shared: false };
  },
  async set(key, value) {
    try { localStorage.setItem(key, value); return { key, value, shared: false }; }
    catch (e) { return null; }
  },
  async delete(key) { localStorage.removeItem(key); return { key, deleted: true, shared: false }; },
  async list(prefix) {
    const keys = Object.keys(localStorage).filter((k) => !prefix || k.startsWith(prefix));
    return { keys, prefix, shared: false };
  },
};

// ---------- Date / format utilities ----------
function pad(n) { return String(n).padStart(2, '0'); }
function todayStr() { const d = new Date(); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; }
function shiftDate(dateStr, days) { const d = new Date(dateStr + 'T00:00:00'); d.setDate(d.getDate() + days); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; }
function shiftMonth(dateStr, months) { const d = new Date(dateStr + 'T00:00:00'); d.setMonth(d.getMonth() + months); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; }
function dayOfYear() { const d = new Date(); const start = new Date(d.getFullYear(), 0, 0); return Math.floor((d - start) / 86400000); }
function getMonday(dateStr) { const d = new Date(dateStr + 'T00:00:00'); const day = d.getDay(); const diff = day === 0 ? -6 : 1 - day; d.setDate(d.getDate() + diff); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; }
function weekKeyFor(dateStr) { return getMonday(dateStr); }
function monthKeyFor(dateStr) { const d = new Date(dateStr + 'T00:00:00'); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}`; }
function formatShortDate(dateStr) { const d = new Date(dateStr + 'T00:00:00'); return `${d.getDate()}/${d.getMonth() + 1}`; }
function formatVND(n) { return (n || 0).toLocaleString('vi-VN') + 'đ'; }
function periodLabelFor(scope, refDate) {
  if (scope === 'day') return new Date(refDate + 'T00:00:00').toLocaleDateString('vi-VN', { weekday: 'long', day: 'numeric', month: 'long' });
  if (scope === 'week') {
    const monday = getMonday(refDate); const sunday = shiftDate(monday, 6);
    const m = new Date(monday + 'T00:00:00'); const s = new Date(sunday + 'T00:00:00');
    return `${m.getDate()}/${m.getMonth() + 1} – ${s.getDate()}/${s.getMonth() + 1}`;
  }
  const d = new Date(refDate + 'T00:00:00'); return `Tháng ${d.getMonth() + 1}, ${d.getFullYear()}`;
}
function isScheduled(habit, dateStr) { if (!habit.days) return true; const weekday = new Date(dateStr + 'T00:00:00').getDay(); return habit.days.includes(weekday); }
function frequencyLabel(habit) { return habit.days.map((d) => { const w = WEEKDAYS.find((x) => x.value === d); return w ? w.label : ''; }).join(' · '); }
function getMonthGrid(year, month) {
  const firstDay = new Date(year, month, 1); const startWeekday = (firstDay.getDay() + 6) % 7;
  const daysInMonth = new Date(year, month + 1, 0).getDate(); const cells = [];
  for (let i = 0; i < startWeekday; i++) cells.push(null);
  for (let day = 1; day <= daysInMonth; day++) cells.push(day);
  return cells;
}
function bucketColor(status) {
  if (status === null || status === undefined) return 'transparent';
  if (status === 0) return 'rgba(212,114,143,0.10)';
  if (status < 0.5) return 'rgba(212,114,143,0.32)';
  if (status < 1) return 'rgba(212,114,143,0.58)';
  return '#D4728F';
}

function WeightChart({ data }) {
  if (data.length < 2) return <p className="text-xs text-center py-6" style={{ color: COLORS.muted }}>Cần ít nhất 2 lần ghi để hiện biểu đồ.</p>;
  const width = 320, height = 140, pad2 = 28;
  const values = data.map((d) => d.value);
  const minV = Math.min(...values), maxV = Math.max(...values);
  const range = maxV - minV || 1;
  const pts = data.map((d, i) => ({
    x: pad2 + (i / (data.length - 1)) * (width - pad2 * 2),
    y: pad2 + (1 - (d.value - minV) / range) * (height - pad2 * 2),
  }));
  return (
    <svg viewBox={`0 0 ${width} ${height}`} className="w-full" style={{ maxHeight: 160 }}>
      <polyline points={pts.map((p) => `${p.x},${p.y}`).join(' ')} fill="none" stroke={COLORS.pinkDeep} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" />
      {pts.map((p, i) => (<circle key={i} cx={p.x} cy={p.y} r="3" fill={COLORS.pinkDeep} />))}
      <text x={pad2} y={height - 6} fontSize="9" fill={COLORS.muted}>{formatShortDate(data[0].date)}</text>
      <text x={width - pad2} y={height - 6} fontSize="9" fill={COLORS.muted} textAnchor="end">{formatShortDate(data[data.length - 1].date)}</text>
      <text x={pad2} y={16} fontSize="9" fill={COLORS.muted}>{maxV} kg</text>
      <text x={pad2} y={height - pad2 + 14} fontSize="9" fill={COLORS.muted}>{minV} kg</text>
    </svg>
  );
}

function HabitsTab({ habits, setHabits, completions, setCompletions, today }) {
  const [showAddForm, setShowAddForm] = useState(false);
  const [newName, setNewName] = useState('');
  const [newIcon, setNewIcon] = useState(EMOJI_OPTIONS[0]);
  const [newFrequencyMode, setNewFrequencyMode] = useState('daily');
  const [newDays, setNewDays] = useState([]);
  const [confirmDeleteId, setConfirmDeleteId] = useState(null);
  const [editingId, setEditingId] = useState(null);
  const [editName, setEditName] = useState('');
  const [editIcon, setEditIcon] = useState('');
  const [editFrequencyMode, setEditFrequencyMode] = useState('daily');
  const [editDays, setEditDays] = useState([]);
  const [viewDate, setViewDate] = useState(today);

  const isDone = useCallback((habitId, dateStr) => !!(completions[habitId] && completions[habitId].includes(dateStr)), [completions]);
  const toggleDay = (habitId) => setCompletions((prev) => { const list = prev[habitId] ? [...prev[habitId]] : []; const idx = list.indexOf(viewDate); if (idx >= 0) list.splice(idx, 1); else list.push(viewDate); return { ...prev, [habitId]: list }; });
  const goPrevDay = () => setViewDate((d) => shiftDate(d, -1));
  const goNextDay = () => setViewDate((d) => (d < today ? shiftDate(d, 1) : d));
  const pickDate = (val) => { if (val && val <= today) setViewDate(val); };
  const toggleNewDay = (val) => setNewDays((prev) => (prev.includes(val) ? prev.filter((v) => v !== val) : [...prev, val]));
  const toggleEditDay = (val) => setEditDays((prev) => (prev.includes(val) ? prev.filter((v) => v !== val) : [...prev, val]));
  const addHabit = () => {
    const name = newName.trim(); if (!name) return;
    const days = newFrequencyMode === 'custom' && newDays.length > 0 ? [...newDays].sort((a, b) => a - b) : null;
    setHabits((prev) => [...prev, { id: 'h' + Date.now(), name, icon: newIcon, days }]);
    setNewName(''); setNewIcon(EMOJI_OPTIONS[0]); setNewFrequencyMode('daily'); setNewDays([]); setShowAddForm(false);
  };
  const deleteHabit = (id) => { setHabits((prev) => prev.filter((h) => h.id !== id)); setCompletions((prev) => { const copy = { ...prev }; delete copy[id]; return copy; }); setConfirmDeleteId(null); };
  const startEdit = (habit) => { setConfirmDeleteId(null); setEditingId(habit.id); setEditName(habit.name); setEditIcon(habit.icon); setEditFrequencyMode(habit.days ? 'custom' : 'daily'); setEditDays(habit.days || []); };
  const saveEdit = () => {
    const name = editName.trim(); if (!name) return;
    const days = editFrequencyMode === 'custom' && editDays.length > 0 ? [...editDays].sort((a, b) => a - b) : null;
    setHabits((prev) => prev.map((h) => (h.id === editingId ? { ...h, name, icon: editIcon, days } : h)));
    setEditingId(null);
  };
  const getStreak = useCallback((habit) => {
    let streak = 0, grace = false;
    for (let offset = 0; offset > -400; offset--) {
      const d = shiftDate(today, offset);
      if (!isScheduled(habit, d)) continue;
      const done = isDone(habit.id, d);
      if (done) streak += 1; else if (offset === 0 && !grace) grace = true; else break;
    }
    return streak;
  }, [isDone, today]);
  const last7 = useMemo(() => { const arr = []; for (let i = -6; i <= 0; i++) arr.push(shiftDate(viewDate, i)); return arr; }, [viewDate]);
  const viewHabits = habits.filter((h) => isScheduled(h, viewDate));
  const completedViewCount = viewHabits.filter((h) => isDone(h.id, viewDate)).length;
  const quote = QUOTES[dayOfYear() % QUOTES.length];
  const isViewingToday = viewDate === today;
  const formattedDate = new Date(viewDate + 'T00:00:00').toLocaleDateString('vi-VN', { weekday: 'long', day: 'numeric', month: 'long' });

  return (
    <div>
      <SectionHeader title="Thói quen mỗi ngày" subtitle={formattedDate} extra={viewHabits.length > 0 && <ProgressRing done={completedViewCount} total={viewHabits.length} />} />
      <div className="flex items-center justify-between mb-5 rounded-2xl px-2 py-1.5" style={{ backgroundColor: COLORS.card, boxShadow: '0 2px 10px rgba(212,114,143,0.10)' }}>
        <button onClick={goPrevDay} className="p-2" style={{ color: COLORS.ink }} aria-label="Ngày trước"><ChevronLeft size={18} /></button>
        <div className="flex items-center gap-2">
          <span className="text-sm font-medium" style={{ color: COLORS.ink }}>{isViewingToday ? 'Hôm nay' : formatShortDate(viewDate)}</span>
          <input type="date" value={viewDate} max={today} onChange={(e) => pickDate(e.target.value)} className="text-xs rounded-lg px-2 py-1" style={{ border: `1px solid ${COLORS.border}`, color: COLORS.ink, backgroundColor: '#FFFFFF' }} aria-label="Chọn ngày" />
          {!isViewingToday && <button onClick={() => setViewDate(today)} className="text-xs font-medium px-2 py-1 rounded-full" style={{ color: COLORS.pinkDeep, border: `1px solid ${COLORS.border}` }}>Về hôm nay</button>}
        </div>
        <button onClick={goNextDay} disabled={isViewingToday} className="p-2" style={{ color: COLORS.ink, opacity: isViewingToday ? 0.25 : 1 }} aria-label="Ngày sau"><ChevronRight size={18} /></button>
      </div>
      {!isViewingToday && <p className="text-xs mb-4 text-center" style={{ color: COLORS.muted }}>Bạn đang đánh dấu cho ngày {formatShortDate(viewDate)} — bấm tick để bổ sung thói quen của ngày này.</p>}
      <div className="mb-6 border-l-2 pl-3" style={{ borderColor: COLORS.pink }}>
        <p style={{ color: COLORS.muted }} className="text-xs uppercase tracking-widest mb-1">Ghi chú hôm nay</p>
        <p style={{ color: COLORS.ink, fontFamily: FONT_DISPLAY }} className="text-base italic leading-relaxed">{quote}</p>
      </div>
      <div className="space-y-3 mb-6">
        {habits.length === 0 ? (
          <div className="rounded-2xl py-10 px-6 text-center" style={{ border: `2px dashed ${COLORS.pink}` }}>
            <p style={{ color: COLORS.ink }} className="text-sm mb-1">🐰 Trang nhật ký này chưa có gì.</p>
            <p style={{ color: COLORS.muted }} className="text-xs">Thêm thói quen đầu tiên bên dưới để bắt đầu theo dõi.</p>
          </div>
        ) : (
          habits.map((habit) => {
            if (editingId === habit.id) {
              return (
                <div key={habit.id} className="rounded-2xl px-4 py-4" style={{ backgroundColor: COLORS.card, boxShadow: '0 2px 10px rgba(212,114,143,0.10)' }}>
                  <div className="flex flex-wrap gap-2 mb-3">{EMOJI_OPTIONS.map((e) => (<button key={e} onClick={() => setEditIcon(e)} className="w-9 h-9 rounded-full flex items-center justify-center text-base" style={{ backgroundColor: editIcon === e ? COLORS.pinkDeep : 'transparent', border: `1px solid ${COLORS.border}` }}>{e}</button>))}</div>
                  <input value={editName} onChange={(e) => setEditName(e.target.value)} placeholder="Tên thói quen" className="w-full rounded-xl px-3 py-2 text-sm mb-3" style={{ border: `1px solid ${COLORS.border}`, color: COLORS.ink, backgroundColor: '#FFFFFF', fontFamily: FONT_BODY }} autoFocus />
                  <FrequencyPicker mode={editFrequencyMode} setMode={setEditFrequencyMode} days={editDays} toggleDay={toggleEditDay} />
                  <div className="flex gap-2">
                    <button onClick={saveEdit} className="flex-1 text-sm font-medium rounded-xl py-2" style={{ backgroundColor: COLORS.pinkDeep, color: '#FFFFFF' }}>Lưu thay đổi</button>
                    <button onClick={() => setEditingId(null)} className="px-4 rounded-xl text-sm" style={{ color: COLORS.muted, border: `1px solid ${COLORS.border}` }}>Hủy</button>
                  </div>
                </div>
              );
            }
            const done = isDone(habit.id, viewDate); const streak = getStreak(habit);
            const offDay = !isScheduled(habit, viewDate);
            return (
              <div key={habit.id} className="rounded-2xl px-4 py-3" style={{ backgroundColor: COLORS.card, boxShadow: '0 2px 10px rgba(212,114,143,0.10)' }}>
                <div className="flex items-center gap-3">
                  <button onClick={() => toggleDay(habit.id)} className="w-9 h-9 rounded-full flex items-center justify-center flex-shrink-0 transition-colors" style={{ backgroundColor: done ? COLORS.pinkDeep : 'transparent', border: `2px solid ${done ? COLORS.pinkDeep : COLORS.border}`, opacity: offDay && !done ? 0.55 : 1 }} aria-label={done ? 'Bỏ đánh dấu ngày này' : 'Đánh dấu hoàn thành ngày này'}>{done && <Check size={16} color="#FFFFFF" />}</button>
                  <span className="text-xl flex-shrink-0">{habit.icon}</span>
                  <div className="flex-1 min-w-0">
                    <p style={{ color: COLORS.ink }} className="text-sm font-medium truncate">{habit.name}</p>
                    {(streak > 0 || habit.days) && (
                      <div className="flex items-center gap-2 mt-0.5 flex-wrap">
                        {streak > 0 && <span className="flex items-center gap-1 text-xs" style={{ color: COLORS.muted }}>🐰 {streak} lần liên tiếp</span>}
                        {habit.days && <span className="text-xs" style={{ color: COLORS.muted }}>{frequencyLabel(habit)}</span>}
                      </div>
                    )}
                  </div>
                  {confirmDeleteId === habit.id ? (
                    <div className="flex items-center gap-1 flex-shrink-0">
                      <button onClick={() => deleteHabit(habit.id)} className="text-xs font-medium px-2 py-1" style={{ color: COLORS.pinkDeep }}>Xóa</button>
                      <button onClick={() => setConfirmDeleteId(null)} className="text-xs px-2 py-1" style={{ color: COLORS.muted }}>Thôi</button>
                    </div>
                  ) : (
                    <div className="flex items-center gap-0.5 flex-shrink-0">
                      <button onClick={() => startEdit(habit)} className="p-1 opacity-40 hover:opacity-70 transition-opacity" style={{ color: COLORS.muted }} aria-label="Sửa thói quen"><Edit2 size={14} /></button>
                      <button onClick={() => { setEditingId(null); setConfirmDeleteId(habit.id); }} className="p-1 opacity-40 hover:opacity-70 transition-opacity" style={{ color: COLORS.muted }} aria-label="Xóa thói quen"><Trash2 size={15} /></button>
                    </div>
                  )}
                </div>
                <div className="flex items-center gap-1.5 mt-3 pl-12">
                  {last7.map((d) => {
                    const scheduled = isScheduled(habit, d);
                    if (!scheduled) return <div key={d} className="w-2.5 h-2.5" />;
                    const dDone = isDone(habit.id, d); const isSelected = d === viewDate;
                    return <div key={d} className="w-2.5 h-2.5 rounded-full" style={{ backgroundColor: dDone ? COLORS.pink : 'transparent', border: `${isSelected ? 2 : 1}px solid ${isSelected ? COLORS.gold : COLORS.border}` }} />;
                  })}
                </div>
              </div>
            );
          })
        )}
      </div>
      {showAddForm ? (
        <div className="rounded-2xl px-4 py-4 mb-4" style={{ backgroundColor: COLORS.card, boxShadow: '0 2px 10px rgba(212,114,143,0.10)' }}>
          <div className="flex flex-wrap gap-2 mb-3">{EMOJI_OPTIONS.map((e) => (<button key={e} onClick={() => setNewIcon(e)} className="w-9 h-9 rounded-full flex items-center justify-center text-base" style={{ backgroundColor: newIcon === e ? COLORS.pinkDeep : 'transparent', border: `1px solid ${COLORS.border}` }}>{e}</button>))}</div>
          <input value={newName} onChange={(e) => setNewName(e.target.value)} placeholder="Tên thói quen" className="w-full rounded-xl px-3 py-2 text-sm mb-3" style={{ border: `1px solid ${COLORS.border}`, color: COLORS.ink, backgroundColor: '#FFFFFF', fontFamily: FONT_BODY }} autoFocus />
          <FrequencyPicker mode={newFrequencyMode} setMode={setNewFrequencyMode} days={newDays} toggleDay={toggleNewDay} />
          <div className="flex gap-2">
            <button onClick={addHabit} className="flex-1 text-sm font-medium rounded-xl py-2" style={{ backgroundColor: COLORS.pinkDeep, color: '#FFFFFF' }}>Thêm thói quen</button>
            <button onClick={() => { setShowAddForm(false); setNewName(''); setNewFrequencyMode('daily'); setNewDays([]); }} className="px-4 rounded-xl text-sm" style={{ color: COLORS.muted, border: `1px solid ${COLORS.border}` }}>Hủy</button>
          </div>
        </div>
      ) : (<button onClick={() => setShowAddForm(true)} className="w-full rounded-2xl py-3 flex items-center justify-center gap-2 text-sm font-medium mb-2" style={{ border: `2px dashed ${COLORS.pink}`, color: COLORS.pinkDeep }}><Plus size={16} />Thêm thói quen</button>)}
    </div>
  );
}

// ---------- Journal tab ----------
function JournalTab({ journalEntries, setJournalEntries, today }) {
  const [viewDate, setViewDate] = useState(today);
  const entry = journalEntries[viewDate] || { note: '', gratitude: [], mood: null };
  const gratitudeList = entry.gratitude || [];
  const updateNote = (text) => setJournalEntries((prev) => ({ ...prev, [viewDate]: { ...(prev[viewDate] || { note: '', gratitude: [], mood: null }), note: text } }));
  const updateGratitudeAt = (idx, text) => setJournalEntries((prev) => { const existing = prev[viewDate] || { note: '', gratitude: [], mood: null }; const g = [...(existing.gratitude || [])]; g[idx] = text; return { ...prev, [viewDate]: { ...existing, gratitude: g } }; });
  const deleteGratitudeAt = (idx) => setJournalEntries((prev) => { const existing = prev[viewDate] || { note: '', gratitude: [], mood: null }; const g = [...(existing.gratitude || [])]; g.splice(idx, 1); return { ...prev, [viewDate]: { ...existing, gratitude: g } }; });
  const updateMood = (value) => setJournalEntries((prev) => { const existing = prev[viewDate] || { note: '', gratitude: [], mood: null }; const newMood = existing.mood === value ? null : value; return { ...prev, [viewDate]: { ...existing, mood: newMood } }; });
  const goPrevDay = () => setViewDate((d) => shiftDate(d, -1));
  const goNextDay = () => setViewDate((d) => (d < today ? shiftDate(d, 1) : d));
  const formattedViewDate = new Date(viewDate + 'T00:00:00').toLocaleDateString('vi-VN', { weekday: 'long', day: 'numeric', month: 'long' });
  return (
    <div>
      <SectionHeader title="Nhật ký" />
      <div className="flex items-center justify-between mb-5">
        <button onClick={goPrevDay} className="p-2" style={{ color: COLORS.ink }} aria-label="Ngày trước"><ChevronLeft size={18} /></button>
        <p style={{ color: COLORS.ink }} className="text-sm font-medium capitalize">{viewDate === today ? 'Hôm nay' : formattedViewDate}</p>
        <button onClick={goNextDay} disabled={viewDate >= today} className="p-2" style={{ color: COLORS.ink, opacity: viewDate >= today ? 0.25 : 1 }} aria-label="Ngày sau"><ChevronRight size={18} /></button>
      </div>
      <div className="rounded-2xl p-4 mb-4" style={{ backgroundColor: COLORS.card, boxShadow: '0 2px 10px rgba(212,114,143,0.10)' }}>
        <p className="text-xs uppercase tracking-widest mb-3" style={{ color: COLORS.muted }}>Tâm trạng hôm nay</p>
        <div className="grid grid-cols-4 gap-x-2 gap-y-3">{MOODS.map((m) => (<button key={m.value} onClick={() => updateMood(m.value)} className="flex flex-col items-center gap-1"><div className="w-10 h-10 rounded-full flex items-center justify-center text-lg" style={{ backgroundColor: m.color, border: entry.mood === m.value ? `2.5px solid ${COLORS.ink}` : '2.5px solid transparent' }}>{m.emoji}</div><span className="text-xs text-center" style={{ color: entry.mood === m.value ? COLORS.ink : COLORS.muted, fontWeight: entry.mood === m.value ? 600 : 400 }}>{m.label}</span></button>))}</div>
      </div>
      <div className="rounded-2xl p-4 mb-4" style={{ backgroundColor: COLORS.card, boxShadow: '0 2px 10px rgba(212,114,143,0.10)' }}>
        <p className="text-xs uppercase tracking-widest mb-2" style={{ color: COLORS.muted }}>Hôm nay bạn thế nào?</p>
        <textarea value={entry.note} onChange={(e) => updateNote(e.target.value)} placeholder="Viết vài dòng..." rows={6} className="w-full text-sm resize-none outline-none" style={{ color: COLORS.ink, backgroundColor: 'transparent', lineHeight: 1.7, fontFamily: FONT_BODY }} />
      </div>
      <div className="rounded-2xl p-4 mb-4" style={{ backgroundColor: COLORS.card, boxShadow: '0 2px 10px rgba(212,114,143,0.10)' }}>
        <p className="text-xs uppercase tracking-widest mb-3" style={{ color: COLORS.muted }}>Góc biết ơn</p>
        <div className="space-y-2">
          {[...gratitudeList, ''].map((val, idx) => (
            <div key={idx} className="flex items-center gap-2">
              <span className="text-xs" style={{ color: COLORS.pinkDeep }}>{idx + 1}.</span>
              <input value={val} onChange={(e) => updateGratitudeAt(idx, e.target.value)} placeholder="Điều bạn biết ơn hôm nay..." className="flex-1 text-sm outline-none bg-transparent pb-1" style={{ color: COLORS.ink, borderBottom: `1px solid ${COLORS.border}`, fontFamily: FONT_BODY }} />
              {idx < gratitudeList.length && val && <button onClick={() => deleteGratitudeAt(idx)} className="flex-shrink-0 opacity-30 hover:opacity-70" style={{ color: COLORS.muted }}><Trash2 size={11} /></button>}
            </div>
          ))}
        </div>
      </div>
    </div>
  );
}

// ---------- Planner tab ----------
function PlannerTab({ plannerData, setPlannerData, today }) {
  const [scope, setScope] = useState('day');
  const [refDate, setRefDate] = useState(today);
  const [newTask, setNewTask] = useState('');
  const [linkedValue, setLinkedValue] = useState('');
  const [editingTaskId, setEditingTaskId] = useState(null);
  const [editText, setEditText] = useState('');
  const [editLinkedValue, setEditLinkedValue] = useState('');

  const periodKey = scope === 'day' ? refDate : scope === 'week' ? weekKeyFor(refDate) : monthKeyFor(refDate);
  const tasks = (plannerData[scope] && plannerData[scope][periodKey]) || [];

  const isDayPlanComplete = (dateStr) => { const t = plannerData.day[dateStr]; return !!(t && t.length > 0 && t.every((x) => x.done)); };
  const isWeekPlanComplete = (wKey) => { const t = plannerData.week[wKey]; if (!t || t.length === 0) return false; return t.every((x) => effectiveDone(x)); };
  const effectiveDone = (item) => { if (item.linkedDate) return isDayPlanComplete(item.linkedDate); if (item.linkedWeek) return isWeekPlanComplete(item.linkedWeek); return item.done; };

  const dayOptions = useMemo(() => Object.keys(plannerData.day).filter((d) => plannerData.day[d] && plannerData.day[d].length > 0).sort().reverse(), [plannerData.day]);
  const weekOptions = useMemo(() => Object.keys(plannerData.week).filter((w) => plannerData.week[w] && plannerData.week[w].length > 0).sort().reverse(), [plannerData.week]);

  const addTask = () => {
    let item;
    if (scope !== 'day' && linkedValue) {
      const [type, val] = linkedValue.split('|');
      item = { id: 't' + Date.now(), text: '', done: false, linkedDate: type === 'day' ? val : null, linkedWeek: type === 'week' ? val : null };
    } else {
      const text = newTask.trim(); if (!text) return;
      item = { id: 't' + Date.now(), text, done: false, linkedDate: null, linkedWeek: null };
    }
    setPlannerData((prev) => ({ ...prev, [scope]: { ...prev[scope], [periodKey]: [...(prev[scope][periodKey] || []), item] } }));
    setNewTask(''); setLinkedValue('');
  };
  const toggleTask = (id) => setPlannerData((prev) => ({ ...prev, [scope]: { ...prev[scope], [periodKey]: (prev[scope][periodKey] || []).map((t) => (t.id === id ? { ...t, done: !t.done } : t)) } }));
  const deleteTask = (id) => setPlannerData((prev) => ({ ...prev, [scope]: { ...prev[scope], [periodKey]: (prev[scope][periodKey] || []).filter((t) => t.id !== id) } }));
  const startEdit = (item) => { setEditingTaskId(item.id); setEditText(item.text || ''); setEditLinkedValue(item.linkedDate ? `day|${item.linkedDate}` : item.linkedWeek ? `week|${item.linkedWeek}` : ''); };
  const saveEdit = () => {
    setPlannerData((prev) => ({
      ...prev,
      [scope]: {
        ...prev[scope],
        [periodKey]: (prev[scope][periodKey] || []).map((t) => {
          if (t.id !== editingTaskId) return t;
          if (scope !== 'day' && editLinkedValue) {
            const [type, val] = editLinkedValue.split('|');
            return { ...t, text: '', linkedDate: type === 'day' ? val : null, linkedWeek: type === 'week' ? val : null };
          }
          return { ...t, text: editText.trim() || t.text, linkedDate: null, linkedWeek: null };
        }),
      },
    }));
    setEditingTaskId(null);
  };
  const goPrev = () => { if (scope === 'day') setRefDate((d) => shiftDate(d, -1)); else if (scope === 'week') setRefDate((d) => shiftDate(d, -7)); else setRefDate((d) => shiftMonth(d, -1)); };
  const goNext = () => { if (scope === 'day') setRefDate((d) => shiftDate(d, 1)); else if (scope === 'week') setRefDate((d) => shiftDate(d, 7)); else setRefDate((d) => shiftMonth(d, 1)); };
  const scopeLabel = scope === 'day' ? 'ngày' : scope === 'week' ? 'tuần' : 'tháng';
  const itemLabel = scope === 'day' ? 'việc' : 'bước';
  const doneCount = tasks.filter((t) => effectiveDone(t)).length;

  return (
    <div>
      <SectionHeader title="Kế hoạch" />
      <div className="flex gap-2 mb-4">{[['day', 'Ngày'], ['week', 'Tuần'], ['month', 'Tháng']].map(([key, label]) => (<button key={key} onClick={() => { setScope(key); setLinkedValue(''); setEditingTaskId(null); }} className="flex-1 rounded-full py-2 text-sm font-medium" style={{ backgroundColor: scope === key ? COLORS.pinkDeep : 'transparent', color: scope === key ? '#FFFFFF' : COLORS.muted, border: scope === key ? 'none' : `1px solid ${COLORS.border}` }}>{label}</button>))}</div>
      <div className="flex items-center justify-between mb-4">
        <button onClick={goPrev} className="p-2" style={{ color: COLORS.ink }} aria-label="Trước"><ChevronLeft size={18} /></button>
        <p className="text-sm font-medium capitalize" style={{ color: COLORS.ink }}>{periodLabelFor(scope, refDate)}</p>
        <button onClick={goNext} className="p-2" style={{ color: COLORS.ink }} aria-label="Sau"><ChevronRight size={18} /></button>
      </div>
      {tasks.length > 0 && (
        <div className="mb-4">
          <div className="flex items-center justify-between mb-1.5"><span className="text-xs" style={{ color: COLORS.muted }}>Tiến độ</span><span className="text-xs font-medium" style={{ color: COLORS.ink }}>{doneCount}/{tasks.length} {itemLabel}</span></div>
          <div className="h-2 rounded-full overflow-hidden" style={{ backgroundColor: COLORS.border }}><div className="h-full rounded-full transition-all duration-500" style={{ width: `${(doneCount / tasks.length) * 100}%`, backgroundColor: COLORS.pinkDeep }} /></div>
        </div>
      )}
      <div className="space-y-2 mb-4">
        {tasks.length === 0 && <p className="text-xs text-center py-8" style={{ color: COLORS.muted }}>Chưa có {itemLabel} nào cho {scopeLabel} này.</p>}
        {tasks.map((item) => {
          if (editingTaskId === item.id) {
            return (
              <div key={item.id} className="rounded-xl px-3 py-3" style={{ backgroundColor: COLORS.card, boxShadow: '0 2px 8px rgba(212,114,143,0.10)' }}>
                {scope !== 'day' && <LinkSelector value={editLinkedValue} onChange={setEditLinkedValue} scope={scope} plannerData={plannerData} dayOptions={dayOptions} weekOptions={weekOptions} />}
                {(scope === 'day' || !editLinkedValue) && (<input value={editText} onChange={(e) => setEditText(e.target.value)} placeholder="Nội dung..." className="w-full rounded-xl px-3 py-2 text-xs mb-2 outline-none" style={{ border: `1px solid ${COLORS.border}`, color: COLORS.ink, fontFamily: FONT_BODY }} />)}
                <div className="flex gap-2">
                  <button onClick={saveEdit} className="flex-1 text-xs font-medium rounded-xl py-2" style={{ backgroundColor: COLORS.pinkDeep, color: '#FFFFFF' }}>Lưu</button>
                  <button onClick={() => setEditingTaskId(null)} className="px-3 rounded-xl text-xs" style={{ color: COLORS.muted, border: `1px solid ${COLORS.border}` }}>Hủy</button>
                </div>
              </div>
            );
          }
          const done = effectiveDone(item);
          const linked = !!(item.linkedDate || item.linkedWeek);
          return (
            <div key={item.id} className="rounded-xl px-3 py-2.5 flex items-center gap-2.5" style={{ backgroundColor: COLORS.card, boxShadow: '0 2px 8px rgba(212,114,143,0.10)' }}>
              <button onClick={() => !linked && toggleTask(item.id)} className="w-5 h-5 rounded-full flex items-center justify-center flex-shrink-0" style={{ backgroundColor: done ? COLORS.pinkDeep : 'transparent', border: `1.5px solid ${done ? COLORS.pinkDeep : COLORS.border}` }}>{done && <Check size={11} color="#FFFFFF" />}</button>
              <div className="flex-1 min-w-0">
                {item.linkedDate ? (
                  <>
                    <p className="text-sm font-medium" style={{ color: COLORS.ink }}>📅 Ngày {formatShortDate(item.linkedDate)}</p>
                    <p className="text-xs truncate" style={{ color: COLORS.muted }}>{(plannerData.day[item.linkedDate] || []).map((t) => t.text).join(', ') || 'Chưa có việc'}</p>
                  </>
                ) : item.linkedWeek ? (
                  <>
                    <p className="text-sm font-medium" style={{ color: COLORS.ink }}>📆 Tuần {periodLabelFor('week', item.linkedWeek)}</p>
                    <p className="text-xs" style={{ color: COLORS.muted }}>{(plannerData.week[item.linkedWeek] || []).length} bước</p>
                  </>
                ) : (<p className="text-sm" style={{ color: done ? COLORS.muted : COLORS.ink, textDecoration: done ? 'line-through' : 'none' }}>{item.text}</p>)}
              </div>
              <button onClick={() => startEdit(item)} className="flex-shrink-0 opacity-40 hover:opacity-70 transition-opacity" style={{ color: COLORS.muted }} aria-label="Sửa"><Edit2 size={13} /></button>
              <button onClick={() => deleteTask(item.id)} className="flex-shrink-0 opacity-40 hover:opacity-70 transition-opacity" style={{ color: COLORS.muted }} aria-label="Xóa"><Trash2 size={13} /></button>
            </div>
          );
        })}
      </div>
      {scope !== 'day' && <LinkSelector value={linkedValue} onChange={setLinkedValue} scope={scope} plannerData={plannerData} dayOptions={dayOptions} weekOptions={weekOptions} />}
      {(scope === 'day' || !linkedValue) ? (
        <div className="flex gap-2">
          <input value={newTask} onChange={(e) => setNewTask(e.target.value)} onKeyDown={(e) => { if (e.key === 'Enter') addTask(); }} placeholder={scope === 'day' ? 'Thêm việc cần làm...' : 'Nhập nội dung bước riêng...'} className="flex-1 rounded-xl px-3 py-2 text-sm outline-none" style={{ backgroundColor: COLORS.card, color: COLORS.ink, border: `1px solid ${COLORS.border}`, fontFamily: FONT_BODY }} />
          <button onClick={addTask} className="rounded-xl px-4 flex items-center justify-center" style={{ backgroundColor: COLORS.pinkDeep }} aria-label="Thêm"><Plus size={18} color="#FFFFFF" /></button>
        </div>
      ) : (<button onClick={addTask} className="w-full rounded-xl py-2.5 text-sm font-medium" style={{ backgroundColor: COLORS.pinkDeep, color: '#FFFFFF' }}>Thêm liên kết này</button>)}
    </div>
  );
}

// ---------- Rewards tab (with Wishlist) ----------
function RewardsTab({ goalsData, setGoalsData, wishlistData, setWishlistData, today }) {
  const [showAddForm, setShowAddForm] = useState(false);
  const [newName, setNewName] = useState('');
  const [rewardMode, setRewardMode] = useState('text');
  const [newReward, setNewReward] = useState('');
  const [newWishlistId, setNewWishlistId] = useState('');
  const [newTarget, setNewTarget] = useState('');
  const [confirmDeleteId, setConfirmDeleteId] = useState(null);
  const [achievementInputs, setAchievementInputs] = useState({});
  const [expandedId, setExpandedId] = useState(null);
  const [editingGoalId, setEditingGoalId] = useState(null);
  const [editName, setEditName] = useState('');
  const [editRewardMode, setEditRewardMode] = useState('text');
  const [editReward, setEditReward] = useState('');
  const [editWishlistId, setEditWishlistId] = useState('');
  const [editTarget, setEditTarget] = useState('');
  const [newWishName, setNewWishName] = useState('');

  const goals = goalsData.goals || [];
  const achievementsFor = (goalId) => goalsData.achievements[goalId] || [];

  const addWishItem = () => { const name = newWishName.trim(); if (!name) return; setWishlistData((prev) => [...prev, { id: 'wl' + Date.now(), name, done: false }]); setNewWishName(''); };
  const toggleWishDone = (id) => setWishlistData((prev) => prev.map((w) => (w.id === id ? { ...w, done: !w.done } : w)));
  const deleteWishItem = (id) => { setWishlistData((prev) => prev.filter((w) => w.id !== id)); setGoalsData((prev) => ({ ...prev, goals: prev.goals.map((g) => (g.wishlistId === id ? { ...g, wishlistId: null } : g)) })); };

  const addGoal = () => {
    const name = newName.trim(); if (!name) return;
    const reward = rewardMode === 'text' ? newReward.trim() : '';
    const wishlistId = rewardMode === 'wishlist' && newWishlistId ? newWishlistId : null;
    if (rewardMode === 'text' && !reward) return;
    if (rewardMode === 'wishlist' && !wishlistId) return;
    const id = 'g' + Date.now();
    const targetNum = newTarget.trim() ? parseInt(newTarget.trim(), 10) : null;
    setGoalsData((prev) => ({ goals: [...prev.goals, { id, name, reward, wishlistId, target: targetNum && targetNum > 0 ? targetNum : null, done: false }], achievements: { ...prev.achievements, [id]: [] } }));
    setNewName(''); setNewReward(''); setNewWishlistId(''); setNewTarget(''); setRewardMode('text'); setShowAddForm(false);
  };
  const deleteGoal = (id) => { setGoalsData((prev) => { const goals2 = prev.goals.filter((g) => g.id !== id); const ach = { ...prev.achievements }; delete ach[id]; return { goals: goals2, achievements: ach }; }); setConfirmDeleteId(null); };
  const toggleGoalDone = (id) => setGoalsData((prev) => ({ ...prev, goals: prev.goals.map((g) => (g.id === id ? { ...g, done: !g.done } : g)) }));
  const startEditGoal = (goal) => { setEditingGoalId(goal.id); setEditName(goal.name); setEditRewardMode(goal.wishlistId ? 'wishlist' : 'text'); setEditReward(goal.reward || ''); setEditWishlistId(goal.wishlistId || ''); setEditTarget(goal.target ? String(goal.target) : ''); };
  const saveEditGoal = () => {
    const name = editName.trim(); if (!name) return;
    const reward = editRewardMode === 'text' ? editReward.trim() : '';
    const wishlistId = editRewardMode === 'wishlist' && editWishlistId ? editWishlistId : null;
    const targetNum = editTarget.trim() ? parseInt(editTarget.trim(), 10) : null;
    setGoalsData((prev) => ({ ...prev, goals: prev.goals.map((g) => (g.id === editingGoalId ? { ...g, name, reward, wishlistId, target: targetNum && targetNum > 0 ? targetNum : null } : g)) }));
    setEditingGoalId(null);
  };
  const addAchievement = (goalId) => { const text = (achievementInputs[goalId] || '').trim(); if (!text) return; const entry = { id: 'a' + Date.now(), text, date: today }; setGoalsData((prev) => ({ ...prev, achievements: { ...prev.achievements, [goalId]: [entry, ...(prev.achievements[goalId] || [])] } })); setAchievementInputs((prev) => ({ ...prev, [goalId]: '' })); };
  const deleteAchievement = (goalId, achId) => setGoalsData((prev) => ({ ...prev, achievements: { ...prev.achievements, [goalId]: (prev.achievements[goalId] || []).filter((a) => a.id !== achId) } }));

  return (
    <div>
      <SectionHeader title="Phần thưởng" />
      <div className="rounded-2xl p-4 mb-5" style={{ backgroundColor: COLORS.card, boxShadow: '0 2px 10px rgba(212,114,143,0.10)' }}>
        <p className="text-xs uppercase tracking-widest mb-3" style={{ color: COLORS.muted }}>Wishlist</p>
        <div className="flex gap-2 mb-3">
          <input value={newWishName} onChange={(e) => setNewWishName(e.target.value)} onKeyDown={(e) => { if (e.key === 'Enter') addWishItem(); }} placeholder="Thêm món mong muốn..." className="flex-1 rounded-xl px-3 py-2 text-xs outline-none" style={{ border: `1px solid ${COLORS.border}`, color: COLORS.ink, fontFamily: FONT_BODY }} />
          <button onClick={addWishItem} className="rounded-xl px-3 flex items-center justify-center flex-shrink-0" style={{ backgroundColor: COLORS.pinkDeep }}><Plus size={14} color="#FFFFFF" /></button>
        </div>
        {wishlistData.length === 0 ? (<p className="text-xs text-center py-2" style={{ color: COLORS.muted }}>Wishlist đang trống.</p>) : (
          <div className="space-y-1.5">
            {wishlistData.map((w) => (
              <div key={w.id} className="flex items-center gap-2">
                <button onClick={() => toggleWishDone(w.id)} className="w-5 h-5 rounded-full flex items-center justify-center flex-shrink-0" style={{ backgroundColor: w.done ? COLORS.pinkDeep : 'transparent', border: `1.5px solid ${w.done ? COLORS.pinkDeep : COLORS.border}` }}>{w.done && <Check size={11} color="#FFFFFF" />}</button>
                <span className="text-xs flex-1" style={{ color: w.done ? COLORS.muted : COLORS.ink, textDecoration: w.done ? 'line-through' : 'none' }}>{w.name}</span>
                <button onClick={() => deleteWishItem(w.id)} className="flex-shrink-0 opacity-30 hover:opacity-70" style={{ color: COLORS.muted }}><Trash2 size={11} /></button>
              </div>
            ))}
          </div>
        )}
      </div>
      <div className="space-y-3 mb-6">
        {goals.length === 0 ? (
          <div className="rounded-2xl py-10 px-6 text-center" style={{ border: `2px dashed ${COLORS.pink}` }}>
            <p style={{ color: COLORS.ink }} className="text-sm mb-1">🎁 Chưa có mục tiêu nào.</p>
            <p style={{ color: COLORS.muted }} className="text-xs">Đặt mục tiêu đầu tiên và treo phần thưởng cho bản thân nhé.</p>
          </div>
        ) : goals.map((goal) => {
          if (editingGoalId === goal.id) {
            return (
              <div key={goal.id} className="rounded-2xl px-4 py-4" style={{ backgroundColor: COLORS.card, boxShadow: '0 2px 10px rgba(212,114,143,0.10)' }}>
                <input value={editName} onChange={(e) => setEditName(e.target.value)} placeholder="Mục tiêu" className="w-full rounded-xl px-3 py-2 text-sm mb-2" style={{ border: `1px solid ${COLORS.border}`, color: COLORS.ink, backgroundColor: '#FFFFFF', fontFamily: FONT_BODY }} />
                <RewardModeForm mode={editRewardMode} setMode={setEditRewardMode} textVal={editReward} setTextVal={setEditReward} wishVal={editWishlistId} setWishVal={setEditWishlistId} wishlistData={wishlistData} />
                <input value={editTarget} onChange={(e) => setEditTarget(e.target.value.replace(/[^0-9]/g, ''))} placeholder="Số thành quả cần đạt (không bắt buộc)" inputMode="numeric" className="w-full rounded-xl px-3 py-2 text-sm mb-3" style={{ border: `1px solid ${COLORS.border}`, color: COLORS.ink, backgroundColor: '#FFFFFF', fontFamily: FONT_BODY }} />
                <div className="flex gap-2">
                  <button onClick={saveEditGoal} className="flex-1 text-sm font-medium rounded-xl py-2" style={{ backgroundColor: COLORS.pinkDeep, color: '#FFFFFF' }}>Lưu thay đổi</button>
                  <button onClick={() => setEditingGoalId(null)} className="px-4 rounded-xl text-sm" style={{ color: COLORS.muted, border: `1px solid ${COLORS.border}` }}>Hủy</button>
                </div>
              </div>
            );
          }
          const list = achievementsFor(goal.id);
          const targetMet = goal.target ? list.length >= goal.target : false;
          const linkedWish = goal.wishlistId ? wishlistData.find((w) => w.id === goal.wishlistId) : null;
          const rewardLabel = linkedWish ? linkedWish.name : goal.reward;
          const rewardClaimed = linkedWish ? linkedWish.done : false;
          const expanded = expandedId === goal.id;
          const shown = expanded ? list : list.slice(0, 2);
          return (
            <div key={goal.id} className="rounded-2xl px-4 py-4" style={{ backgroundColor: COLORS.card, boxShadow: '0 2px 10px rgba(212,114,143,0.10)', border: (goal.done || rewardClaimed) ? `1.5px solid ${COLORS.gold}` : 'none' }}>
              <div className="flex items-start justify-between gap-2 mb-1">
                <div className="flex items-start gap-2 flex-1 min-w-0">
                  <button onClick={() => toggleGoalDone(goal.id)} className="w-6 h-6 rounded-full flex items-center justify-center flex-shrink-0 mt-0.5" style={{ backgroundColor: goal.done ? COLORS.pinkDeep : 'transparent', border: `2px solid ${goal.done ? COLORS.pinkDeep : COLORS.border}` }} aria-label={goal.done ? 'Bỏ đánh dấu hoàn thành' : 'Đánh dấu hoàn thành mục tiêu'}>
                    {goal.done && <Check size={13} color="#FFFFFF" />}
                  </button>
                  <p style={{ color: COLORS.ink, textDecoration: goal.done ? 'line-through' : 'none' }} className="text-sm font-semibold flex-1 min-w-0">{goal.name}</p>
                </div>
                {confirmDeleteId === goal.id ? (
                  <div className="flex items-center gap-1 flex-shrink-0">
                    <button onClick={() => deleteGoal(goal.id)} className="text-xs font-medium px-2 py-1" style={{ color: COLORS.pinkDeep }}>Xóa</button>
                    <button onClick={() => setConfirmDeleteId(null)} className="text-xs px-2 py-1" style={{ color: COLORS.muted }}>Thôi</button>
                  </div>
                ) : (
                  <div className="flex items-center gap-0.5 flex-shrink-0">
                    <button onClick={() => startEditGoal(goal)} className="p-1 opacity-40 hover:opacity-70" style={{ color: COLORS.muted }}><Edit2 size={13} /></button>
                    <button onClick={() => setConfirmDeleteId(goal.id)} className="p-1 opacity-40 hover:opacity-70" style={{ color: COLORS.muted }}><Trash2 size={14} /></button>
                  </div>
                )}
              </div>
              <div className="flex items-center gap-2 mb-3 flex-wrap pl-8">
                <p className="text-xs" style={{ color: COLORS.muted }}>🎀 {rewardLabel}</p>
                {linkedWish && <button onClick={() => toggleWishDone(linkedWish.id)} className="text-xs px-2 py-0.5 rounded-full" style={{ backgroundColor: rewardClaimed ? 'rgba(212,175,122,0.18)' : 'transparent', color: rewardClaimed ? COLORS.gold : COLORS.pinkDeep, border: `1px solid ${rewardClaimed ? COLORS.gold : COLORS.border}` }}>{rewardClaimed ? '✓ Đã nhận' : 'Đánh dấu đã nhận'}</button>}
              </div>
              {targetMet && !rewardClaimed && <div className="rounded-xl px-3 py-2 mb-3 text-xs font-medium text-center" style={{ backgroundColor: 'rgba(212,175,122,0.18)', color: COLORS.gold }}>🎉 Đã đủ thành quả{linkedWish ? ' — đánh dấu nhận thưởng ở trên nhé!' : '!'}</div>}
              {rewardClaimed && <div className="rounded-xl px-3 py-2 mb-3 text-xs font-medium text-center" style={{ backgroundColor: 'rgba(212,175,122,0.18)', color: COLORS.gold }}>🎉 Đã nhận: {rewardLabel}</div>}
              {goal.target ? (
                <div className="mb-3">
                  <div className="flex items-center justify-between mb-1"><span className="text-xs" style={{ color: COLORS.muted }}>Tiến độ</span><span className="text-xs font-medium" style={{ color: COLORS.ink }}>{list.length}/{goal.target} thành quả</span></div>
                  <div className="h-2 rounded-full overflow-hidden" style={{ backgroundColor: COLORS.border }}><div className="h-full rounded-full transition-all duration-500" style={{ width: `${Math.min(100, (list.length / goal.target) * 100)}%`, backgroundColor: targetMet ? COLORS.gold : COLORS.pinkDeep }} /></div>
                </div>
              ) : (<p className="text-xs mb-3" style={{ color: COLORS.muted }}>{list.length} thành quả đã ghi nhận</p>)}
              <div className="flex gap-2 mb-3">
                <input value={achievementInputs[goal.id] || ''} onChange={(e) => setAchievementInputs((prev) => ({ ...prev, [goal.id]: e.target.value }))} onKeyDown={(e) => { if (e.key === 'Enter') addAchievement(goal.id); }} placeholder="Ghi nhận thành quả nhỏ..." className="flex-1 rounded-xl px-3 py-1.5 text-xs outline-none" style={{ border: `1px solid ${COLORS.border}`, color: COLORS.ink, fontFamily: FONT_BODY }} />
                <button onClick={() => addAchievement(goal.id)} className="rounded-xl px-3 flex items-center justify-center" style={{ backgroundColor: COLORS.pinkDeep }}><Plus size={14} color="#FFFFFF" /></button>
              </div>
              {list.length > 0 && (
                <div className="space-y-1.5">
                  {shown.map((a) => (<div key={a.id} className="flex items-center justify-between gap-2"><p className="text-xs flex-1 min-w-0" style={{ color: COLORS.ink }}>• {a.text} <span style={{ color: COLORS.muted }}>({formatShortDate(a.date)})</span></p><button onClick={() => deleteAchievement(goal.id, a.id)} className="flex-shrink-0 opacity-30 hover:opacity-70" style={{ color: COLORS.muted }}><Trash2 size={11} /></button></div>))}
                  {list.length > 2 && <button onClick={() => setExpandedId(expanded ? null : goal.id)} className="text-xs" style={{ color: COLORS.pinkDeep }}>{expanded ? 'Thu gọn' : `Xem tất cả ${list.length} thành quả`}</button>}
                </div>
              )}
            </div>
          );
        })}
      </div>
      {showAddForm ? (
        <div className="rounded-2xl px-4 py-4 mb-4" style={{ backgroundColor: COLORS.card, boxShadow: '0 2px 10px rgba(212,114,143,0.10)' }}>
          <input value={newName} onChange={(e) => setNewName(e.target.value)} placeholder="Mục tiêu (VD: Hoàn thành khóa SQL)" className="w-full rounded-xl px-3 py-2 text-sm mb-2" style={{ border: `1px solid ${COLORS.border}`, color: COLORS.ink, backgroundColor: '#FFFFFF', fontFamily: FONT_BODY }} />
          <RewardModeForm mode={rewardMode} setMode={setRewardMode} textVal={newReward} setTextVal={setNewReward} wishVal={newWishlistId} setWishVal={setNewWishlistId} wishlistData={wishlistData} />
          <input value={newTarget} onChange={(e) => setNewTarget(e.target.value.replace(/[^0-9]/g, ''))} placeholder="Số thành quả cần đạt (không bắt buộc)" inputMode="numeric" className="w-full rounded-xl px-3 py-2 text-sm mb-3" style={{ border: `1px solid ${COLORS.border}`, color: COLORS.ink, backgroundColor: '#FFFFFF', fontFamily: FONT_BODY }} />
          <div className="flex gap-2">
            <button onClick={addGoal} className="flex-1 text-sm font-medium rounded-xl py-2" style={{ backgroundColor: COLORS.pinkDeep, color: '#FFFFFF' }}>Thêm mục tiêu</button>
            <button onClick={() => { setShowAddForm(false); setNewName(''); setNewReward(''); setNewWishlistId(''); setNewTarget(''); setRewardMode('text'); }} className="px-4 rounded-xl text-sm" style={{ color: COLORS.muted, border: `1px solid ${COLORS.border}` }}>Hủy</button>
          </div>
        </div>
      ) : (<button onClick={() => setShowAddForm(true)} className="w-full rounded-2xl py-3 flex items-center justify-center gap-2 text-sm font-medium mb-2" style={{ border: `2px dashed ${COLORS.pink}`, color: COLORS.pinkDeep }}><Plus size={16} />Đặt mục tiêu mới</button>)}
    </div>
  );
}

// ---------- Weight tab (Small Wins + Weekly Weight only) ----------
function WeightTab({ victories, setVictories, weightLog, setWeightLog, today }) {
  const [victoryInput, setVictoryInput] = useState('');
  const [victoriesExpanded, setVictoriesExpanded] = useState(false);
  const addVictory = () => { const text = victoryInput.trim(); if (!text) return; setVictories((prev) => [{ id: 'v' + Date.now(), text, date: today }, ...prev]); setVictoryInput(''); };
  const deleteVictory = (id) => setVictories((prev) => prev.filter((v) => v.id !== id));
  const shownVictories = victoriesExpanded ? victories : victories.slice(0, 3);

  const [logDate, setLogDate] = useState(today);
  const [logValue, setLogValue] = useState('');
  const [logExpanded, setLogExpanded] = useState(false);
  const addWeightEntry = () => { const val = parseFloat(logValue); if (!val || val <= 0) return; setWeightLog((prev) => [...prev, { id: 'l' + Date.now(), date: logDate, value: val }]); setLogValue(''); };
  const deleteLogEntry = (id) => setWeightLog((prev) => prev.filter((e) => e.id !== id));
  const sortedLogDesc = useMemo(() => [...weightLog].sort((a, b) => (a.date < b.date ? 1 : -1)), [weightLog]);
  const sortedLogAsc = useMemo(() => [...weightLog].sort((a, b) => (a.date > b.date ? 1 : -1)).slice(-12), [weightLog]);
  const shownLog = logExpanded ? sortedLogDesc : sortedLogDesc.slice(0, 4);
  const note = WEIGHT_NOTES[dayOfYear() % WEIGHT_NOTES.length];
  const formattedDate = new Date().toLocaleDateString('vi-VN', { weekday: 'long', day: 'numeric', month: 'long' });

  return (
    <div>
      <SectionHeader title="Giảm cân" subtitle={formattedDate} />
      <div className="mb-6 border-l-2 pl-3" style={{ borderColor: COLORS.pink }}>
        <p style={{ color: COLORS.muted }} className="text-xs uppercase tracking-widest mb-1">Ghi chú hôm nay</p>
        <p style={{ color: COLORS.ink, fontFamily: FONT_DISPLAY }} className="text-base italic leading-relaxed">{note}</p>
      </div>
      <div className="rounded-2xl p-4 mb-5" style={{ backgroundColor: COLORS.card, boxShadow: '0 2px 10px rgba(212,114,143,0.10)' }}>
        <p className="text-xs uppercase tracking-widest mb-1" style={{ color: COLORS.muted }}>Chiến thắng nhỏ</p>
        <p className="text-xs mb-3" style={{ color: COLORS.muted }}>Những tiến bộ mà cái cân không nói lên được.</p>
        <div className="flex gap-2 mb-3">
          <input value={victoryInput} onChange={(e) => setVictoryInput(e.target.value)} onKeyDown={(e) => { if (e.key === 'Enter') addVictory(); }} placeholder="VD: Quần mặc thoải mái hơn..." className="flex-1 rounded-xl px-3 py-2 text-xs outline-none" style={{ border: `1px solid ${COLORS.border}`, color: COLORS.ink, fontFamily: FONT_BODY }} />
          <button onClick={addVictory} className="rounded-xl px-3 flex items-center justify-center flex-shrink-0" style={{ backgroundColor: COLORS.pinkDeep }}><Plus size={14} color="#FFFFFF" /></button>
        </div>
        {victories.length === 0 ? (<p className="text-xs text-center py-3" style={{ color: COLORS.muted }}>Chưa có ghi chú nào.</p>) : (
          <div className="space-y-1.5">
            {shownVictories.map((v) => (<div key={v.id} className="flex items-center justify-between gap-2"><p className="text-xs flex-1 min-w-0" style={{ color: COLORS.ink }}>🎀 {v.text} <span style={{ color: COLORS.muted }}>({formatShortDate(v.date)})</span></p><button onClick={() => deleteVictory(v.id)} className="flex-shrink-0 opacity-30 hover:opacity-70" style={{ color: COLORS.muted }}><Trash2 size={11} /></button></div>))}
            {victories.length > 3 && <button onClick={() => setVictoriesExpanded((v) => !v)} className="text-xs" style={{ color: COLORS.pinkDeep }}>{victoriesExpanded ? 'Thu gọn' : `Xem tất cả ${victories.length}`}</button>}
          </div>
        )}
      </div>
      <div className="rounded-2xl p-4" style={{ backgroundColor: COLORS.card, boxShadow: '0 2px 10px rgba(212,114,143,0.10)' }}>
        <p className="text-xs uppercase tracking-widest mb-1" style={{ color: COLORS.muted }}>Cân nặng hàng tuần</p>
        <p className="text-xs mb-3" style={{ color: COLORS.muted }}>Không bắt buộc — chỉ để xem xu hướng chung, không phải áp lực mỗi ngày.</p>
        <div className="mb-3"><WeightChart data={sortedLogAsc} /></div>
        <div className="flex gap-2 mb-3">
          <input type="date" value={logDate} onChange={(e) => setLogDate(e.target.value)} className="rounded-xl px-2 py-2 text-xs" style={{ border: `1px solid ${COLORS.border}`, color: COLORS.ink, backgroundColor: '#FFFFFF' }} />
          <input type="number" step="0.1" inputMode="decimal" value={logValue} onChange={(e) => setLogValue(e.target.value)} onKeyDown={(e) => { if (e.key === 'Enter') addWeightEntry(); }} placeholder="kg" className="w-20 rounded-xl px-2 py-2 text-xs" style={{ border: `1px solid ${COLORS.border}`, color: COLORS.ink, backgroundColor: '#FFFFFF' }} />
          <button onClick={addWeightEntry} className="rounded-xl px-3 flex items-center justify-center flex-shrink-0" style={{ backgroundColor: COLORS.pinkDeep }}><Plus size={14} color="#FFFFFF" /></button>
        </div>
        {sortedLogDesc.length === 0 ? (<p className="text-xs text-center py-3" style={{ color: COLORS.muted }}>Chưa có ghi chú nào.</p>) : (
          <div className="space-y-1.5">
            {shownLog.map((entry) => (<div key={entry.id} className="flex items-center justify-between gap-2"><span className="text-xs" style={{ color: COLORS.muted }}>{formatShortDate(entry.date)}</span><span className="text-xs font-medium flex-1 text-right pr-2" style={{ color: COLORS.ink }}>{entry.value} kg</span><button onClick={() => deleteLogEntry(entry.id)} className="flex-shrink-0 opacity-30 hover:opacity-70" style={{ color: COLORS.muted }}><Trash2 size={11} /></button></div>))}
            {sortedLogDesc.length > 4 && <button onClick={() => setLogExpanded((v) => !v)} className="text-xs" style={{ color: COLORS.pinkDeep }}>{logExpanded ? 'Thu gọn' : `Xem tất cả ${sortedLogDesc.length}`}</button>}
          </div>
        )}
      </div>
    </div>
  );
}

// ---------- Finance tab ----------
function FinanceTab({ financeData, setFinanceData, today }) {
  const [viewMonthKey, setViewMonthKey] = useState(monthKeyFor(today));
  const [showCatForm, setShowCatForm] = useState(false);
  const [newCatName, setNewCatName] = useState('');
  const [newCatLimit, setNewCatLimit] = useState('');
  const [editingCatId, setEditingCatId] = useState(null);
  const [editCatName, setEditCatName] = useState('');
  const [editCatLimit, setEditCatLimit] = useState('');
  const [expenseFormFor, setExpenseFormFor] = useState(null);
  const [expenseAmount, setExpenseAmount] = useState('');
  const [expenseNote, setExpenseNote] = useState('');
  const [editingIncome, setEditingIncome] = useState(false);
  const [incomeInput, setIncomeInput] = useState('');

  const categories = financeData.categories || [];
  const monthData = financeData.months[viewMonthKey] || { income: 0, transactions: [] };
  const spentFor = (catId) => monthData.transactions.filter((t) => t.categoryId === catId).reduce((s, t) => s + t.amount, 0);
  const totalSpent = monthData.transactions.reduce((s, t) => s + t.amount, 0);

  const goPrevMonth = () => setViewMonthKey((k) => monthKeyFor(shiftMonth(k + '-01', -1)));
  const goNextMonth = () => setViewMonthKey((k) => monthKeyFor(shiftMonth(k + '-01', 1)));

  const addCategory = () => { const name = newCatName.trim(); if (!name) return; const limit = parseFloat(newCatLimit) || 0; setFinanceData((prev) => ({ ...prev, categories: [...prev.categories, { id: 'c' + Date.now(), name, limit }] })); setNewCatName(''); setNewCatLimit(''); setShowCatForm(false); };
  const startEditCat = (cat) => { setEditingCatId(cat.id); setEditCatName(cat.name); setEditCatLimit(String(cat.limit || '')); };
  const saveEditCat = () => { const name = editCatName.trim(); if (!name) return; const limit = parseFloat(editCatLimit) || 0; setFinanceData((prev) => ({ ...prev, categories: prev.categories.map((c) => (c.id === editingCatId ? { ...c, name, limit } : c)) })); setEditingCatId(null); };
  const deleteCategory = (id) => setFinanceData((prev) => ({ ...prev, categories: prev.categories.filter((c) => c.id !== id) }));

  const saveIncome = () => { const val = parseFloat(incomeInput) || 0; setFinanceData((prev) => ({ ...prev, months: { ...prev.months, [viewMonthKey]: { ...(prev.months[viewMonthKey] || { income: 0, transactions: [] }), income: val } } })); setEditingIncome(false); };
  const addTransaction = (categoryId) => {
    const amt = parseFloat(expenseAmount); if (!amt || amt <= 0) return;
    const tx = { id: 'tx' + Date.now(), categoryId, amount: amt, note: expenseNote.trim(), date: today };
    setFinanceData((prev) => { const existing = prev.months[viewMonthKey] || { income: 0, transactions: [] }; return { ...prev, months: { ...prev.months, [viewMonthKey]: { ...existing, transactions: [tx, ...existing.transactions] } } }; });
    setExpenseAmount(''); setExpenseNote(''); setExpenseFormFor(null);
  };
  const deleteTransaction = (id) => setFinanceData((prev) => { const existing = prev.months[viewMonthKey] || { income: 0, transactions: [] }; return { ...prev, months: { ...prev.months, [viewMonthKey]: { ...existing, transactions: existing.transactions.filter((t) => t.id !== id) } } }; });

  return (
    <div>
      <SectionHeader title="Tài chính" />
      <div className="flex items-center justify-between mb-4">
        <button onClick={goPrevMonth} className="p-2" style={{ color: COLORS.ink }} aria-label="Tháng trước"><ChevronLeft size={18} /></button>
        <p className="text-sm font-medium capitalize" style={{ color: COLORS.ink }}>{periodLabelFor('month', viewMonthKey + '-01')}</p>
        <button onClick={goNextMonth} className="p-2" style={{ color: COLORS.ink }} aria-label="Tháng sau"><ChevronRight size={18} /></button>
      </div>
      <div className="rounded-2xl p-4 mb-5" style={{ backgroundColor: COLORS.card, boxShadow: '0 2px 10px rgba(212,114,143,0.10)' }}>
        <div className="flex items-center justify-between mb-2">
          <span className="text-xs" style={{ color: COLORS.muted }}>Thu nhập tháng này</span>
          {editingIncome ? (
            <div className="flex gap-1 items-center">
              <input type="number" value={incomeInput} onChange={(e) => setIncomeInput(e.target.value)} className="w-28 text-xs rounded-lg px-2 py-1" style={{ border: `1px solid ${COLORS.border}` }} autoFocus />
              <button onClick={saveIncome} className="text-xs font-medium" style={{ color: COLORS.pinkDeep }}>Lưu</button>
            </div>
          ) : (
            <button onClick={() => { setIncomeInput(String(monthData.income || '')); setEditingIncome(true); }} className="flex items-center gap-1 text-sm font-semibold" style={{ color: COLORS.ink }}>{formatVND(monthData.income)}<Edit2 size={11} /></button>
          )}
        </div>
        <div className="flex items-center justify-between text-xs" style={{ color: COLORS.muted }}>
          <span>Đã chi: {formatVND(totalSpent)}</span>
          <span>Còn lại: {formatVND((monthData.income || 0) - totalSpent)}</span>
        </div>
      </div>
      <div className="space-y-3 mb-4">
        {categories.length === 0 ? (
          <div className="rounded-2xl py-8 px-6 text-center" style={{ border: `2px dashed ${COLORS.pink}` }}><p className="text-sm" style={{ color: COLORS.ink }}>Chưa có danh mục chi tiêu nào.</p></div>
        ) : categories.map((cat) => {
          if (editingCatId === cat.id) {
            return (
              <div key={cat.id} className="rounded-2xl px-4 py-3" style={{ backgroundColor: COLORS.card, boxShadow: '0 2px 10px rgba(212,114,143,0.10)' }}>
                <input value={editCatName} onChange={(e) => setEditCatName(e.target.value)} placeholder="Tên danh mục" className="w-full rounded-xl px-3 py-2 text-sm mb-2" style={{ border: `1px solid ${COLORS.border}`, color: COLORS.ink, backgroundColor: '#FFFFFF' }} />
                <input type="number" value={editCatLimit} onChange={(e) => setEditCatLimit(e.target.value)} placeholder="Hạn mức (VNĐ)" className="w-full rounded-xl px-3 py-2 text-sm mb-2" style={{ border: `1px solid ${COLORS.border}`, color: COLORS.ink, backgroundColor: '#FFFFFF' }} />
                <div className="flex gap-2"><button onClick={saveEditCat} className="flex-1 text-xs font-medium rounded-xl py-2" style={{ backgroundColor: COLORS.pinkDeep, color: '#FFFFFF' }}>Lưu</button><button onClick={() => setEditingCatId(null)} className="px-3 rounded-xl text-xs" style={{ color: COLORS.muted, border: `1px solid ${COLORS.border}` }}>Hủy</button></div>
              </div>
            );
          }
          const spent = spentFor(cat.id);
          const pct = cat.limit ? Math.min(100, (spent / cat.limit) * 100) : 0;
          const over = cat.limit > 0 && spent > cat.limit;
          const txs = monthData.transactions.filter((t) => t.categoryId === cat.id);
          return (
            <div key={cat.id} className="rounded-2xl px-4 py-3" style={{ backgroundColor: COLORS.card, boxShadow: '0 2px 10px rgba(212,114,143,0.10)' }}>
              <div className="flex items-center justify-between mb-1">
                <p className="text-sm font-medium" style={{ color: COLORS.ink }}>{cat.name}</p>
                <div className="flex items-center gap-0.5"><button onClick={() => startEditCat(cat)} className="p-1 opacity-40 hover:opacity-70" style={{ color: COLORS.muted }}><Edit2 size={12} /></button><button onClick={() => deleteCategory(cat.id)} className="p-1 opacity-40 hover:opacity-70" style={{ color: COLORS.muted }}><Trash2 size={13} /></button></div>
              </div>
              <div className="flex items-center justify-between text-xs mb-1" style={{ color: over ? COLORS.pinkDeep : COLORS.muted }}>
                <span>{formatVND(spent)} / {formatVND(cat.limit)}</span>
                {over && <span>Vượt hạn mức</span>}
              </div>
              <div className="h-1.5 rounded-full overflow-hidden mb-2" style={{ backgroundColor: COLORS.border }}><div className="h-full rounded-full" style={{ width: `${pct}%`, backgroundColor: over ? COLORS.pinkDeep : COLORS.pink }} /></div>
              {expenseFormFor === cat.id ? (
                <div className="flex gap-2 mb-2">
                  <input type="number" inputMode="decimal" value={expenseAmount} onChange={(e) => setExpenseAmount(e.target.value)} placeholder="Số tiền" className="w-24 rounded-lg px-2 py-1.5 text-xs" style={{ border: `1px solid ${COLORS.border}`, color: COLORS.ink }} />
                  <input value={expenseNote} onChange={(e) => setExpenseNote(e.target.value)} onKeyDown={(e) => { if (e.key === 'Enter') addTransaction(cat.id); }} placeholder="Ghi chú..." className="flex-1 rounded-lg px-2 py-1.5 text-xs" style={{ border: `1px solid ${COLORS.border}`, color: COLORS.ink }} />
                  <button onClick={() => addTransaction(cat.id)} className="rounded-lg px-2 flex items-center justify-center" style={{ backgroundColor: COLORS.pinkDeep }}><Plus size={13} color="#FFFFFF" /></button>
                </div>
              ) : (<button onClick={() => setExpenseFormFor(cat.id)} className="text-xs" style={{ color: COLORS.pinkDeep }}>+ Ghi chi tiêu</button>)}
              {txs.length > 0 && (
                <div className="mt-2 space-y-1">
                  {txs.slice(0, 3).map((t) => (<div key={t.id} className="flex items-center justify-between text-xs gap-2"><span className="truncate flex-1" style={{ color: COLORS.muted }}>{t.note || '(không ghi chú)'}</span><span style={{ color: COLORS.ink }}>{formatVND(t.amount)}</span><button onClick={() => deleteTransaction(t.id)} className="flex-shrink-0 opacity-30 hover:opacity-70" style={{ color: COLORS.muted }}><Trash2 size={10} /></button></div>))}
                </div>

          );
