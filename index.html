      {showCatForm ? (
        <div className="rounded-2xl p-4" style={{ backgroundColor: COLORS.card, boxShadow: '0 2px 10px rgba(212,114,143,0.10)' }}>
          <input value={newCatName} onChange={(e) => setNewCatName(e.target.value)} placeholder="Tên danh mục (VD: Ăn uống)" className="w-full rounded-xl px-3 py-2 text-sm mb-2" style={{ border: `1px solid ${COLORS.border}`, color: COLORS.ink, backgroundColor: '#FFFFFF' }} />
          <input type="number" value={newCatLimit} onChange={(e) => setNewCatLimit(e.target.value)} placeholder="Hạn mức (VNĐ)" className="w-full rounded-xl px-3 py-2 text-sm mb-3" style={{ border: `1px solid ${COLORS.border}`, color: COLORS.ink, backgroundColor: '#FFFFFF' }} />
          <div className="flex gap-2"><button onClick={addCategory} className="flex-1 text-sm font-medium rounded-xl py-2" style={{ backgroundColor: COLORS.pinkDeep, color: '#FFFFFF' }}>Thêm danh mục</button><button onClick={() => setShowCatForm(false)} className="px-4 rounded-xl text-sm" style={{ color: COLORS.muted, border: `1px solid ${COLORS.border}` }}>Hủy</button></div>
        </div>
      ) : (<button onClick={() => setShowCatForm(true)} className="w-full rounded-2xl py-3 flex items-center justify-center gap-2 text-sm font-medium" style={{ border: `2px dashed ${COLORS.pink}`, color: COLORS.pinkDeep }}><Plus size={16} />Thêm danh mục chi tiêu</button>)}
    </div>
  );
}

// ---------- Mood chart ----------
function MoodChart({ journalEntries, today, viewMonth }) {
  const [mode, setMode] = useState('pie');
  const [range, setRange] = useState('30');
  const [sel, setSel] = useState(null);
  const days = useMemo(() => {
    if (range === 'month') { const n = new Date(viewMonth.year, viewMonth.month + 1, 0).getDate(); return Array.from({ length: n }, (_, i) => `${viewMonth.year}-${pad(viewMonth.month + 1)}-${pad(i + 1)}`); }
    const n = range === '7' ? 7 : 30; return Array.from({ length: n }, (_, i) => shiftDate(today, i - (n - 1)));
  }, [range, viewMonth, today]);
  const data = useMemo(() => days.map((d) => { const j = journalEntries[d]; const m = j && j.mood ? MOODS.find((x) => x.value === j.mood) : null; return { date: d, mood: m || null, future: d > today }; }), [days, journalEntries, today]);
  const logged = data.filter((x) => x.mood);
  const counts = MOODS.map((m) => ({ ...m, count: logged.filter((x) => x.mood.value === m.value).length })).filter((m) => m.count > 0);
  const total = logged.length;
  const top = counts.slice().sort((a, b) => b.count - a.count)[0];
  const avg = total ? logged.reduce((a, x) => a + x.mood.score, 0) / total : 0;
  const fmt = (d) => `${d.slice(8, 10)}/${d.slice(5, 7)}`;
  const R = 42, C = 2 * Math.PI * R;
  let acc = 0;
  const segs = counts.map((m) => { const frac = m.count / total; const gap = counts.length > 1 ? 2.2 : 0; const len = Math.max(frac * C - gap, 0.5); const seg = { m, len, off: acc }; acc += frac * C; return seg; });
  const selMood = mode === 'pie' && sel ? counts.find((m) => m.value === sel) : null;
  const selDay = mode === 'bar' && sel ? data.find((x) => x.date === sel) : null;
  const pill = (active) => ({ backgroundColor: active ? COLORS.pinkDeep : 'transparent', color: active ? '#FFFFFF' : COLORS.muted, border: `1px solid ${active ? COLORS.pinkDeep : COLORS.border}` });
  const changeMode = (m) => { setMode(m); setSel(null); };
  const changeRange = (r) => { setRange(r); setSel(null); };
  return (
    <div className="rounded-2xl p-4 mt-5" style={{ backgroundColor: COLORS.card, boxShadow: '0 2px 10px rgba(212,114,143,0.10)' }}>
      <p className="text-base font-semibold mb-1" style={{ color: COLORS.ink, fontFamily: FONT_DISPLAY }}>Biểu đồ cảm xúc</p>
      <p className="text-xs mb-3" style={{ color: COLORS.muted }}>Tâm trạng bạn chọn trong Nhật ký</p>
      <div className="flex flex-wrap gap-2 mb-3">
        <div className="flex gap-1.5">
          <button onClick={() => changeMode('pie')} className="text-xs px-3 py-1.5 rounded-full" style={pill(mode === 'pie')}>Biểu đồ tròn</button>
          <button onClick={() => changeMode('bar')} className="text-xs px-3 py-1.5 rounded-full" style={pill(mode === 'bar')}>Cột theo ngày</button>
        </div>
        <div className="flex gap-1.5">
          {[['7', '7 ngày'], ['30', '30 ngày'], ['month', 'Tháng đang xem']].map(([k, l]) => <button key={k} onClick={() => changeRange(k)} className="text-xs px-3 py-1.5 rounded-full" style={pill(range === k)}>{l}</button>)}
        </div>
      </div>
      {total === 0 ? (
        <div className="rounded-xl py-8 text-center" style={{ backgroundColor: COLORS.cardSoft }}><p className="text-sm" style={{ color: COLORS.muted }}>Chưa có tâm trạng nào trong khoảng này.<br />Chọn tâm trạng trong tab Nhật ký để thấy biểu đồ nhé 🌸</p></div>
      ) : (
        <div>
          <div className="flex gap-3 mb-4">
            <div className="flex-1 rounded-xl px-3 py-2" style={{ backgroundColor: COLORS.cardSoft }}><p className="text-xs" style={{ color: COLORS.muted }}>Hay gặp nhất</p><p className="text-sm font-medium" style={{ color: COLORS.ink }}>{top.emoji} {top.label} ({top.count})</p></div>
            <div className="flex-1 rounded-xl px-3 py-2" style={{ backgroundColor: COLORS.cardSoft }}><p className="text-xs" style={{ color: COLORS.muted }}>Đã ghi</p><p className="text-sm font-medium" style={{ color: COLORS.ink }}>{total}/{data.filter((x) => !x.future).length} ngày</p></div>
            <div className="flex-1 rounded-xl px-3 py-2" style={{ backgroundColor: COLORS.cardSoft }}><p className="text-xs" style={{ color: COLORS.muted }}>Trung bình</p><p className="text-sm font-medium" style={{ color: COLORS.ink }}>{avg.toFixed(1)}/5</p></div>
          </div>
          {mode === 'pie' ? (
            <div>
              <div className="flex justify-center mb-3">
                <svg viewBox="0 0 120 120" width="180" height="180" role="img" aria-label="Biểu đồ tròn tâm trạng">
                  <g transform="rotate(-90 60 60)">
                    {segs.map((sg) => <circle key={sg.m.value} cx="60" cy="60" r={R} fill="none" stroke={sg.m.color} strokeWidth={sel === sg.m.value ? 20 : 16} strokeDasharray={`${sg.len} ${C - sg.len}`} strokeDashoffset={-sg.off - (counts.length > 1 ? 1.1 : 0)} onClick={() => setSel(sel === sg.m.value ? null : sg.m.value)} style={{ cursor: 'pointer', opacity: sel && sel !== sg.m.value ? 0.45 : 1 }} />)}
                  </g>
                  <text x="60" y="58" textAnchor="middle" fontSize="18" fill={COLORS.ink}>{selMood ? selMood.emoji : '🌸'}</text>
                  <text x="60" y="73" textAnchor="middle" fontSize="9" fill={COLORS.muted}>{selMood ? `${selMood.count} ngày · ${Math.round(selMood.count / total * 100)}%` : `${total} ngày`}</text>
                </svg>
              </div>
              <div className="grid grid-cols-2 gap-x-3 gap-y-1.5">
                {counts.map((m) => (
                  <button key={m.value} onClick={() => setSel(sel === m.value ? null : m.value)} className="flex items-center gap-2 text-left rounded-lg px-2 py-1.5" style={{ backgroundColor: sel === m.value ? COLORS.cardSoft : 'transparent' }}>
                    <span className="w-3 h-3 rounded-full flex-shrink-0" style={{ backgroundColor: m.color, border: '1px solid rgba(92,69,83,0.25)' }} />
                    <span className="text-xs flex-1 truncate" style={{ color: COLORS.ink }}>{m.emoji} {m.label}</span>
                    <span className="text-xs" style={{ color: COLORS.muted }}>{m.count} · {Math.round(m.count / total * 100)}%</span>
                  </button>
                ))}
              </div>
            </div>
          ) : (
            <div>
              <div className="flex gap-2">
                <div className="flex flex-col justify-between text-xs py-1" style={{ color: COLORS.muted, height: 140 }}><span>Cao</span><span>Thấp</span></div>
                <div className="flex-1 flex items-end gap-0.5" style={{ height: 140, borderBottom: `1px solid ${COLORS.border}` }}>
                  {data.map((x) => {
                    const h = x.mood ? (x.mood.score / 5) * 100 : 0;
                    const isSel = sel === x.date;
                    return (
                      <button key={x.date} onClick={() => x.mood && setSel(isSel ? null : x.date)} className="flex-1 flex flex-col items-center justify-end h-full min-w-0" aria-label={x.mood ? `${fmt(x.date)} ${x.mood.label}` : fmt(x.date)}>
                        {x.mood && data.length <= 14 && <span style={{ fontSize: 11, lineHeight: 1, marginBottom: 2 }}>{x.mood.emoji}</span>}
                        <div style={{ width: '100%', height: x.mood ? `${h * (data.length <= 14 ? 0.82 : 1)}%` : 3, backgroundColor: x.mood ? x.mood.color : x.future ? 'transparent' : COLORS.border, borderRadius: '4px 4px 0 0', outline: isSel ? `2px solid ${COLORS.ink}` : 'none', opacity: sel && !isSel ? 0.5 : 1 }} />
                      </button>
                    );
                  })}
                </div>
              </div>
              <div className="flex gap-2 mt-1"><div style={{ width: 28 }} /><div className="flex-1 flex gap-0.5">{data.map((x, i) => <div key={x.date} className="flex-1 text-center min-w-0" style={{ fontSize: 9, color: COLORS.muted }}>{data.length <= 14 || i % 5 === 0 ? x.date.slice(8, 10) : ''}</div>)}</div></div>
              <p className="text-xs text-center mt-2" style={{ color: COLORS.muted }}>Cột càng cao = tâm trạng càng tích cực. Chạm vào cột để xem chi tiết.</p>
            </div>
          )}
          {(selDay && selDay.mood) && <div className="rounded-xl px-3 py-2 mt-3 text-sm text-center" style={{ backgroundColor: COLORS.cardSoft, color: COLORS.ink }}>{fmt(selDay.date)} · {selDay.mood.emoji} {selDay.mood.label}</div>}
        </div>
      )}
    </div>
  );
}

// ---------- Calendar tab ----------
function CalendarTab({ habits, completions, journalEntries, today }) {
  const [viewMonth, setViewMonth] = useState(() => { const d = new Date(today + 'T00:00:00'); return { year: d.getFullYear(), month: d.getMonth() }; });
  const isDone = useCallback((habitId, dateStr) => !!(completions[habitId] && completions[habitId].includes(dateStr)), [completions]);
  const dayStatus = useCallback((dateStr) => { const scheduled = habits.filter((h) => isScheduled(h, dateStr)); if (scheduled.length === 0) return null; const doneCount = scheduled.filter((h) => isDone(h.id, dateStr)).length; return doneCount / scheduled.length; }, [habits, isDone]);
  const currentStreak = useMemo(() => { let streak = 0, grace = false; for (let o = 0; o > -400; o--) { const d = shiftDate(today, o); const s = dayStatus(d); if (s === null) continue; if (s === 1) streak += 1; else if (o === 0 && !grace) grace = true; else break; } return streak; }, [dayStatus, today]);
  const longestStreak = useMemo(() => { let longest = 0, cur = 0; for (let o = -365; o <= 0; o++) { const d = shiftDate(today, o); const s = dayStatus(d); if (s === null) continue; if (s === 1) { cur += 1; longest = Math.max(longest, cur); } else cur = 0; } return longest; }, [dayStatus, today]);
  const grid = getMonthGrid(viewMonth.year, viewMonth.month);
  const monthLabel = new Date(viewMonth.year, viewMonth.month, 1).toLocaleDateString('vi-VN', { month: 'long', year: 'numeric' });
  const goPrevMonth = () => setViewMonth((v) => { const m = v.month - 1; return m < 0 ? { year: v.year - 1, month: 11 } : { year: v.year, month: m }; });
  const goNextMonth = () => setViewMonth((v) => { const m = v.month + 1; return m > 11 ? { year: v.year + 1, month: 0 } : { year: v.year, month: m }; });
  return (
    <div>
      <SectionHeader title="Lịch thành tựu" />
      <div className="flex gap-3 mb-5">
        <div className="flex-1 rounded-2xl px-4 py-3" style={{ backgroundColor: COLORS.card, boxShadow: '0 2px 10px rgba(212,114,143,0.10)' }}><p className="text-xs" style={{ color: COLORS.muted }}>Chuỗi hiện tại</p><p className="text-2xl font-semibold" style={{ color: COLORS.ink, fontFamily: FONT_DISPLAY }}>{currentStreak}<span className="text-xs font-normal ml-1">ngày</span></p></div>
        <div className="flex-1 rounded-2xl px-4 py-3" style={{ backgroundColor: COLORS.card, boxShadow: '0 2px 10px rgba(212,114,143,0.10)' }}><p className="text-xs" style={{ color: COLORS.muted }}>Kỷ lục</p><p className="text-2xl font-semibold" style={{ color: COLORS.ink, fontFamily: FONT_DISPLAY }}>{longestStreak}<span className="text-xs font-normal ml-1">ngày</span></p></div>
      </div>
      <div className="rounded-2xl p-4" style={{ backgroundColor: COLORS.cardSoft, boxShadow: '0 2px 10px rgba(212,114,143,0.08)' }}>
        <div className="flex items-center justify-between mb-3">
          <button onClick={goPrevMonth} className="p-1" style={{ color: COLORS.ink }} aria-label="Tháng trước"><ChevronLeft size={18} /></button>
          <p className="text-sm font-medium capitalize" style={{ color: COLORS.ink }}>{monthLabel}</p>
          <button onClick={goNextMonth} className="p-1" style={{ color: COLORS.ink }} aria-label="Tháng sau"><ChevronRight size={18} /></button>
        </div>
        <div className="grid grid-cols-7 gap-1.5 mb-2">{WEEKDAYS.map((w) => <div key={w.value} className="text-center text-xs" style={{ color: COLORS.muted }}>{w.label}</div>)}</div>
        <div className="grid grid-cols-7 gap-1.5">
          {grid.map((day, i) => {
            if (day === null) return <div key={'b' + i} />;
            const dateStr = `${viewMonth.year}-${pad(viewMonth.month + 1)}-${pad(day)}`;
            const isFuture = dateStr > today; const isToday = dateStr === today;
            const status = isFuture ? null : dayStatus(dateStr);
            const j = journalEntries[dateStr];
            const moodColor = j && j.mood ? (MOODS.find((m) => m.value === j.mood) || {}).color : null;
            const hasJournalText = !!(j && ((j.note && j.note.trim()) || (j.gratitude || []).some((g) => g && g.trim())));
            const dotColor = !isFuture ? moodColor || (hasJournalText ? COLORS.gold : null) : null;
            const textColor = status !== null && status >= 0.5 ? '#FFFFFF' : isFuture ? 'rgba(92,69,83,0.3)' : COLORS.ink;
            return (
              <div key={dateStr} className="aspect-square rounded-lg flex items-center justify-center relative" style={{ backgroundColor: status === null ? 'transparent' : bucketColor(status), border: isToday ? `2px solid ${COLORS.gold}` : status === null ? `1px solid ${COLORS.border}` : 'none' }}>
                <span className="text-xs" style={{ color: textColor }}>{day}</span>
                {dotColor && <div className="absolute bottom-0.5 right-0.5 w-1.5 h-1.5 rounded-full" style={{ backgroundColor: dotColor, border: '1px solid rgba(255,255,255,0.7)' }} />}
              </div>
            );
          })}
        </div>
        <div className="flex items-center justify-end gap-1 mt-3"><span className="text-xs mr-1" style={{ color: COLORS.muted }}>Ít</span>{[0, 0.25, 0.6, 1].map((v, i) => <div key={i} className="w-2.5 h-2.5 rounded" style={{ backgroundColor: bucketColor(v) }} />)}<span className="text-xs ml-1" style={{ color: COLORS.muted }}>Nhiều</span></div>
        <p className="text-xs text-center mt-2" style={{ color: COLORS.muted }}>Chấm nhỏ ở góc là màu tâm trạng bạn chọn trong Nhật ký</p>
      </div>
      <MoodChart journalEntries={journalEntries} today={today} viewMonth={viewMonth} />
    </div>
  );
}

// ---------- Sidebar navigation ----------
function Sidebar({ active, onChange, collapsed, onToggle }) {
  const tabs = [
    { key: 'habits', label: 'Thói quen', Icon: Heart },
    { key: 'weight', label: 'Giảm cân', Icon: Activity },
    { key: 'journal', label: 'Nhật ký', Icon: BookOpen },
    { key: 'calendar', label: 'Lịch', Icon: Calendar },
    { key: 'planner', label: 'Kế hoạch', Icon: ListChecks },
    { key: 'rewards', label: 'Thưởng & Wishlist', Icon: Gift },
    { key: 'finance', label: 'Tài chính', Icon: Wallet },
  ];
  return (
    <div className="h-screen flex-shrink-0 flex flex-col sticky top-0" style={{ width: collapsed ? 56 : 220, backgroundColor: '#FFFFFF', borderRight: `1px solid ${COLORS.border}`, transition: 'width 180ms ease', overflow: 'hidden' }}>
      <button onClick={onToggle} className="flex items-center gap-3 px-4 py-4 flex-shrink-0" style={{ color: COLORS.ink }} aria-label={collapsed ? 'Mở rộng menu' : 'Thu gọn menu'}>
        <Menu size={20} />
        {!collapsed && <span className="text-xs font-medium" style={{ color: COLORS.muted }}>Thu gọn</span>}
      </button>
      <div className="flex-1 overflow-y-auto px-2 pb-4">
        {tabs.map((t) => {
          const Icon = t.Icon; const isActive = active === t.key;
          const extraProps = t.key === 'habits' ? { fill: isActive ? COLORS.pinkDeep : 'none' } : {};
          return (
            <button key={t.key} onClick={() => onChange(t.key)} className="w-full flex items-center gap-3 px-3 py-3 rounded-xl mb-1" style={{ backgroundColor: isActive ? 'rgba(212,114,143,0.12)' : 'transparent' }} title={t.label}>
              <Icon size={19} style={{ color: isActive ? COLORS.pinkDeep : COLORS.muted, flexShrink: 0 }} {...extraProps} />
              {!collapsed && <span className="text-sm font-medium truncate text-left" style={{ color: isActive ? COLORS.pinkDeep : COLORS.muted }}>{t.label}</span>}
            </button>
          );
        })}
      </div>
    </div>
  );
}

// ---------- Root app ----------
function HabitTracker() {
  const [activeTab, setActiveTab] = useState('habits');
  const [sidebarCollapsed, setSidebarCollapsed] = useState(true);
  const [habits, setHabits] = useState([]);
  const [completions, setCompletions] = useState({});
  const [journalEntries, setJournalEntries] = useState({});
  const [plannerData, setPlannerData] = useState({ day: {}, week: {}, month: {} });
  const [goalsData, setGoalsData] = useState({ goals: [], achievements: {} });
  const [weightVictories, setWeightVictories] = useState([]);
  const [weightLog, setWeightLog] = useState([]);
  const [wishlistData, setWishlistData] = useState([]);
  const [financeData, setFinanceData] = useState({ categories: [], months: {} });
  const [loading, setLoading] = useState(true);
  const [saveError, setSaveError] = useState(false);
  const [importMessage, setImportMessage] = useState(null);
  const fileInputRef = useRef(null);
  const today = todayStr();

  const exportData = () => {
    const payload = { exportedAt: new Date().toISOString(), habits, completions, journalEntries, plannerData, goalsData, weightVictories, weightLog, wishlistData, financeData };
    const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = `nhat-ky-backup-${today}.json`;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);
  };
  const importData = (e) => {
    const file = e.target.files[0]; if (!file) return;
    if (!window.confirm('Nhập dữ liệu sẽ THAY THẾ toàn bộ dữ liệu hiện tại trên thiết bị này. Bạn có chắc chắn không?')) { e.target.value = ''; return; }
    const reader = new FileReader();
    reader.onload = (event) => {
      try {
        const data = JSON.parse(event.target.result);
        if (Array.isArray(data.habits)) setHabits(data.habits);
        if (data.completions) setCompletions(data.completions);
        if (data.journalEntries) setJournalEntries(data.journalEntries);
        if (data.plannerData) setPlannerData(data.plannerData);
        if (data.goalsData) setGoalsData(data.goalsData);
        if (Array.isArray(data.weightVictories)) setWeightVictories(data.weightVictories);
        if (Array.isArray(data.weightLog)) setWeightLog(data.weightLog);
        if (Array.isArray(data.wishlistData)) setWishlistData(data.wishlistData);
        if (data.financeData) setFinanceData(data.financeData);
        setImportMessage({ type: 'success', text: 'Đã khôi phục dữ liệu thành công!' });
      } catch (err) { setImportMessage({ type: 'error', text: 'File không hợp lệ, thử lại nhé.' }); }
    };
    reader.readAsText(file); e.target.value = '';
  };

  useEffect(() => {
    let mounted = true;
    (async () => {
      const [habitsRes, journalRes, plannerRes, goalsRes, victoriesRes, logRes, wishlistRes, financeRes] = await Promise.allSettled([
        window.storage.get(HABITS_KEY), window.storage.get(JOURNAL_KEY), window.storage.get(PLANNER_KEY), window.storage.get(GOALS_KEY),
        window.storage.get(WEIGHT_VICTORIES_KEY), window.storage.get(WEIGHT_LOG_KEY), window.storage.get(WISHLIST_KEY), window.storage.get(FINANCE_KEY),
      ]);
      if (!mounted) return;
      if (habitsRes.status === 'fulfilled' && habitsRes.value && habitsRes.value.value) {
        try { const parsed = JSON.parse(habitsRes.value.value); setHabits(parsed.habits || DEFAULT_HABITS); setCompletions(parsed.completions || {}); }
        catch (e) { setHabits(DEFAULT_HABITS); }
      } else { setHabits(DEFAULT_HABITS); }
      if (journalRes.status === 'fulfilled' && journalRes.value && journalRes.value.value) {
        try { setJournalEntries(JSON.parse(journalRes.value.value).entries || {}); } catch (e) { setJournalEntries({}); }
      }
      if (plannerRes.status === 'fulfilled' && plannerRes.value && plannerRes.value.value) {
        try { const parsed = JSON.parse(plannerRes.value.value); setPlannerData({ day: parsed.day || {}, week: parsed.week || {}, month: parsed.month || {} }); }
        catch (e) { setPlannerData({ day: {}, week: {}, month: {} }); }
      }
      if (goalsRes.status === 'fulfilled' && goalsRes.value && goalsRes.value.value) {
        try { const parsed = JSON.parse(goalsRes.value.value); setGoalsData({ goals: parsed.goals || [], achievements: parsed.achievements || {} }); }
        catch (e) { setGoalsData({ goals: [], achievements: {} }); }
      }
      if (victoriesRes.status === 'fulfilled' && victoriesRes.value && victoriesRes.value.value) {
        try { const parsed = JSON.parse(victoriesRes.value.value); setWeightVictories(Array.isArray(parsed) ? parsed : []); } catch (e) { setWeightVictories([]); }
      }
      if (logRes.status === 'fulfilled' && logRes.value && logRes.value.value) {
        try { const parsed = JSON.parse(logRes.value.value); setWeightLog(Array.isArray(parsed) ? parsed : []); } catch (e) { setWeightLog([]); }
      }
      if (wishlistRes.status === 'fulfilled' && wishlistRes.value && wishlistRes.value.value) {
        try { const parsed = JSON.parse(wishlistRes.value.value); setWishlistData(Array.isArray(parsed) ? parsed : []); } catch (e) { setWishlistData([]); }
      }
      if (financeRes.status === 'fulfilled' && financeRes.value && financeRes.value.value) {
        try { const parsed = JSON.parse(financeRes.value.value); setFinanceData({ categories: parsed.categories || [], months: parsed.months || {} }); } catch (e) { setFinanceData({ categories: [], months: {} }); }
      }
      setLoading(false);
    })();
    return () => { mounted = false; };
  }, []);

  useEffect(() => { if (loading) return; const t = setTimeout(async () => { try { const r = await window.storage.set(HABITS_KEY, JSON.stringify({ habits, completions })); setSaveError(!r); } catch (e) { setSaveError(true); } }, 300); return () => clearTimeout(t); }, [habits, completions, loading]);
  useEffect(() => { if (loading) return; const t = setTimeout(async () => { try { const r = await window.storage.set(JOURNAL_KEY, JSON.stringify({ entries: journalEntries })); setSaveError(!r); } catch (e) { setSaveError(true); } }, 300); return () => clearTimeout(t); }, [journalEntries, loading]);
  useEffect(() => { if (loading) return; const t = setTimeout(async () => { try { const r = await window.storage.set(PLANNER_KEY, JSON.stringify(plannerData)); setSaveError(!r); } catch (e) { setSaveError(true); } }, 300); return () => clearTimeout(t); }, [plannerData, loading]);
  useEffect(() => { if (loading) return; const t = setTimeout(async () => { try { const r = await window.storage.set(GOALS_KEY, JSON.stringify(goalsData)); setSaveError(!r); } catch (e) { setSaveError(true); } }, 300); return () => clearTimeout(t); }, [goalsData, loading]);
  useEffect(() => { if (loading) return; const t = setTimeout(async () => { try { const r = await window.storage.set(WEIGHT_VICTORIES_KEY, JSON.stringify(weightVictories)); setSaveError(!r); } catch (e) { setSaveError(true); } }, 300); return () => clearTimeout(t); }, [weightVictories, loading]);
  useEffect(() => { if (loading) return; const t = setTimeout(async () => { try { const r = await window.storage.set(WEIGHT_LOG_KEY, JSON.stringify(weightLog)); setSaveError(!r); } catch (e) { setSaveError(true); } }, 300); return () => clearTimeout(t); }, [weightLog, loading]);
  useEffect(() => { if (loading) return; const t = setTimeout(async () => { try { const r = await window.storage.set(WISHLIST_KEY, JSON.stringify(wishlistData)); setSaveError(!r); } catch (e) { setSaveError(true); } }, 300); return () => clearTimeout(t); }, [wishlistData, loading]);
  useEffect(() => { if (loading) return; const t = setTimeout(async () => { try { const r = await window.storage.set(FINANCE_KEY, JSON.stringify(financeData)); setSaveError(!r); } catch (e) { setSaveError(true); } }, 300); return () => clearTimeout(t); }, [financeData, loading]);

  const bgPattern = { backgroundColor: COLORS.bg, backgroundImage: 'repeating-linear-gradient(45deg, rgba(255,255,255,0.5) 0px, rgba(255,255,255,0.5) 1px, transparent 1px, transparent 34px), repeating-linear-gradient(-45deg, rgba(255,255,255,0.5) 0px, rgba(255,255,255,0.5) 1px, transparent 1px, transparent 34px)' };

  if (loading) return <div className="min-h-screen flex items-center justify-center" style={{ ...bgPattern, fontFamily: FONT_BODY }}><div className="text-sm" style={{ color: COLORS.muted }}>🐰 Đang tải...</div></div>;

  return (
    <div className="min-h-screen w-full flex" style={{ ...bgPattern, fontFamily: FONT_BODY }}>
      <Sidebar active={activeTab} onChange={setActiveTab} collapsed={sidebarCollapsed} onToggle={() => setSidebarCollapsed((v) => !v)} />
      <div className="flex-1 min-w-0" style={{ maxHeight: '100vh', overflowY: 'auto' }}>
        <div className="max-w-2xl mx-auto px-5 py-6">
          {activeTab === 'habits' && <HabitsTab habits={habits} setHabits={setHabits} completions={completions} setCompletions={setCompletions} today={today} />}
          {activeTab === 'journal' && <JournalTab journalEntries={journalEntries} setJournalEntries={setJournalEntries} today={today} />}
          {activeTab === 'planner' && <PlannerTab plannerData={plannerData} setPlannerData={setPlannerData} today={today} />}
          {activeTab === 'rewards' && <RewardsTab goalsData={goalsData} setGoalsData={setGoalsData} wishlistData={wishlistData} setWishlistData={setWishlistData} today={today} />}
          {activeTab === 'weight' && <WeightTab victories={weightVictories} setVictories={setWeightVictories} weightLog={weightLog} setWeightLog={setWeightLog} today={today} />}
          {activeTab === 'finance' && <FinanceTab financeData={financeData} setFinanceData={setFinanceData} today={today} />}
          {activeTab === 'calendar' && (
            <>
              <CalendarTab habits={habits} completions={completions} journalEntries={journalEntries} today={today} />
              <div className="rounded-2xl p-4 mt-5" style={{ backgroundColor: COLORS.card, boxShadow: '0 2px 10px rgba(212,114,143,0.10)' }}>
                <p className="text-xs uppercase tracking-widest mb-1" style={{ color: COLORS.muted }}>Dữ liệu của bạn</p>
                <p className="text-xs mb-3" style={{ color: COLORS.muted }}>Sao lưu để phòng khi cần khôi phục hoặc chuyển sang thiết bị khác.</p>
                <div className="flex gap-2">
                  <button onClick={exportData} className="flex-1 rounded-xl py-2 text-xs font-medium" style={{ backgroundColor: COLORS.pinkDeep, color: '#FFFFFF' }}>Xuất dữ liệu</button>
                  <button onClick={() => fileInputRef.current && fileInputRef.current.click()} className="flex-1 rounded-xl py-2 text-xs font-medium" style={{ border: `1px solid ${COLORS.border}`, color: COLORS.ink }}>Nhập dữ liệu</button>
                </div>
                <input ref={fileInputRef} type="file" accept="application/json" onChange={importData} style={{ display: 'none' }} />
                {importMessage && <p className="text-xs mt-2 text-center" style={{ color: importMessage.type === 'error' ? COLORS.pinkDeep : COLORS.gold }}>{importMessage.text}</p>}
              </div>
            </>
          )}
          {saveError && <p className="text-xs text-center mt-2" style={{ color: COLORS.pinkDeep }}>Chưa lưu được thay đổi. Thử lại.</p>}
        </div>
      </div>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<HabitTracker />);
</script>
</body>
</html>
